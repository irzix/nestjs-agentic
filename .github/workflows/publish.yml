name: Publish to NPM

on:
  workflow_dispatch:
  release:
    types: [ published ]
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build monorepo packages
        run: npm run build

      - name: Run Test Suite
        run: npm run test

      - name: Publish @nestjs-agentic/core
        run: |
          cd packages/core
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nestjs-agentic/adk
        run: |
          cd packages/runtime-adk
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish nestjs-agentic (Meta Package)
        run: |
          cd packages/meta
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
