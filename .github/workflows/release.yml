name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build monorepo packages
        run: npm run build

      - name: Run test suite
        run: npm run test

      # With pending changesets this opens or updates a "Version Packages" pull
      # request that bumps versions, rewrites internal dependency ranges, and
      # updates changelogs. Once that pull request is merged there are no
      # changesets left, so this step publishes instead.
      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          # One GitHub release per version (next step), not one per package.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # Every package is versioned together (the changesets `fixed` group), so a
      # version gets a single GitHub release, `vX.Y.Z`, carrying each published
      # package's changelog section. With createGithubReleases off, the action
      # no longer pushes the per-package tags `changeset publish` created, so
      # they are pushed here first.
      - name: Push tags and create GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          node -e "for (const p of JSON.parse(process.env.PUBLISHED_PACKAGES)) console.log(p.name + '@' + p.version)" |
            while read -r tag; do
              git push origin "refs/tags/$tag:refs/tags/$tag"
            done
          VERSION=$(node -e "const p = JSON.parse(process.env.PUBLISHED_PACKAGES); console.log((p.find((x) => x.name === '@nestjs-agentic/core') ?? p[0]).version)")
          node scripts/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --target "$GITHUB_SHA"

      - name: Summarize outcome
        run: |
          if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
            echo "Published: ${{ steps.changesets.outputs.publishedPackages }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ steps.changesets.outputs.pullRequestNumber }}" ]; then
            echo "Version pull request ready: #${{ steps.changesets.outputs.pullRequestNumber }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No pending changesets and nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          fi
