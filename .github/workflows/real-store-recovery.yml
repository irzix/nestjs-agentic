name: Real store recovery
on:
  pull_request:
  push:
    branches: [main]
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd 'redis-cli ping' --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic_test
          POSTGRES_DB: agentic_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U agentic -d agentic_test' --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/15
      POSTGRES_URL: postgres://agentic:agentic_test@127.0.0.1:5432/agentic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run test:real-stores --workspace=@nestjs-agentic/core
